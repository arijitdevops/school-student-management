{% extends 'base.html' %}
{% block title %}Page not found &middot; {{ school_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
  <p class="display-1 fw-light text-body-secondary mb-0">404</p>
  <h1 class="h4 mb-3">That page does not exist</h1>
  <p class="text-body-secondary">
    The record may have been removed, or the address may be mistyped.
  </p>
  <a class="btn btn-primary" href="{{ url_for('main.index') }}">Back to the dashboard</a>
</div>
{% endblock %}
