[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "school-student-management"
version = "1.0.0"
description = "A Flask and MySQL application for managing students, subjects, marks and report cards for classes 1 to 10."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Common Labs" }]
keywords = ["flask", "mysql", "sqlalchemy", "school", "students", "report-card"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "Flask>=3.0,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Migrate>=4.0,<5",
    "Flask-WTF>=1.2,<2",
    "WTForms>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "PyMySQL>=1.1,<2",
    "cryptography>=42.0",
    "email-validator>=2.1,<3",
    "python-dotenv>=1.0,<2",
    "Faker>=30.0,<41",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.5,<1",
]
prod = [
    "gunicorn>=22.0,<24; platform_system != 'Windows'",
    "waitress>=3.0,<4; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/commonlabs/school-student-management"
Issues = "https://github.com/commonlabs/school-student-management/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
# D105/D106/D107: dunder, Meta and __init__ docstrings are covered by the class docstring.
# D413: no blank line required after the last docstring section.
# UP006/UP035/UP045: keep typing.Dict/List/Optional spellings for Python 3.9 readers.
ignore = ["D105", "D106", "D107", "D203", "D213", "D413", "UP006", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["E402"]
